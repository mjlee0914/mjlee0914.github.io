<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Event Poll Form</title>
    </head>
    <body>
        <h1>설문조사</h1>
        <hr>
        학년 선택:
        <label><input name="grade" type="radio" checked>1학년</label>
        <label><input name="grade" type="radio">2학년</label>
        <label><input name="grade" type="radio">3학년</label>
        <br>
        취미 선택(복수 입력 가능):
        <label><input type="checkbox">운동하기</label>
        <label><input type="checkbox">음악 감상하기</label>
        <label><input type="checkbox">비디오 게임하기</label>
    </body>
</html>
