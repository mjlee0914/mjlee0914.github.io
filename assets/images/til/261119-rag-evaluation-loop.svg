<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">RAG 평가와 개선의 순환 구조</title>
  <desc id="desc">질의 분석, 검색, 생성, 분리 평가, 실패 진단, 개선, 회귀 검증으로 이어지는 순환 구조</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <style>
      .box { fill: #f8fafc; stroke: #334155; stroke-width: 2; rx: 14; }
      .metric { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; rx: 14; }
      .action { fill: #f0fdf4; stroke: #15803d; stroke-width: 2; rx: 14; }
      .text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 23px; font-weight: 600; fill: #0f172a; text-anchor: middle; }
      .sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 17px; fill: #475569; text-anchor: middle; }
      .line { fill: none; stroke: #334155; stroke-width: 3; marker-end: url(#arrow); }
      .label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 17px; fill: #334155; font-weight: 600; }
    </style>
  </defs>
  <rect width="1200" height="620" fill="#ffffff"/>
  <text x="600" y="48" class="text" style="font-size:30px">RAG 평가와 개선의 순환 구조</text>

  <rect x="70" y="105" width="250" height="100" class="box"/>
  <text x="195" y="146" class="text">1. 질의 분석</text>
  <text x="195" y="178" class="sub">유형 분류와 검색 라우팅</text>

  <rect x="475" y="105" width="250" height="100" class="box"/>
  <text x="600" y="146" class="text">2. 검색·생성</text>
  <text x="600" y="178" class="sub">RAG 파이프라인 실행</text>

  <rect x="880" y="105" width="250" height="100" class="metric"/>
  <text x="1005" y="142" class="text">3. 분리 평가</text>
  <text x="1005" y="173" class="sub">검색: Precision·Recall</text>
  <text x="1005" y="196" class="sub">생성: Faithfulness·Relevancy</text>

  <rect x="880" y="365" width="250" height="100" class="box"/>
  <text x="1005" y="405" class="text">4. 실패 진단</text>
  <text x="1005" y="438" class="sub">청킹·필터·환각·프롬프트</text>

  <rect x="475" y="365" width="250" height="100" class="action"/>
  <text x="600" y="405" class="text">5. 단일 개선</text>
  <text x="600" y="438" class="sub">한 번에 한 변수만 변경</text>

  <rect x="70" y="365" width="250" height="100" class="metric"/>
  <text x="195" y="405" class="text">6. 회귀 검증</text>
  <text x="195" y="438" class="sub">동일한 골든셋으로 재평가</text>

  <path d="M320 155 L475 155" class="line"/>
  <path d="M725 155 L880 155" class="line"/>
  <path d="M1005 205 L1005 365" class="line"/>
  <path d="M880 415 L725 415" class="line"/>
  <path d="M475 415 L320 415" class="line"/>
  <path d="M195 365 C195 285 600 290 600 205" class="line"/>
  <text x="345" y="288" class="label">통과한 사례도 다시 확인</text>

  <rect x="390" y="520" width="420" height="62" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" rx="10"/>
  <text x="600" y="548" class="sub" style="font-weight:600">평가 기준: 고정된 질문·모범 정답·근거 문서</text>
  <text x="600" y="572" class="sub">평균 점수뿐 아니라 개별 사례와 질의 유형별 변화 확인</text>
</svg>
